[project]
name = "atenas-core"
version = "0.1.0"
description = "Telegram-first, local-running LLM study assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nathan Lúcio" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-telegram-bot>=21.6",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.6",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "pip-audit>=2.10.1",
]

[project.scripts]
atenas = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "core*", "skills*"]
exclude = ["data*", "logs*", "memory*", "output*", "inbox*", "web*", "tests*", "docs*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "data", "logs", "memory", "output", "inbox"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # FastAPI/click use calls in argument defaults
    "E501",  # long strings/prompts; line length is advisory
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# TODO: remove once the in-flight work on these files lands, then fix their findings.
"app/bot.py" = ["ALL"]
"app/cli.py" = ["ALL"]
"app/dashboard.py" = ["ALL"]
"core/retrieval/*" = ["ALL"]
"core/knowledge/*" = ["ALL"]
